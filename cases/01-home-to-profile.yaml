android:
  deviceId: "${ANDROID_DEVICE_ID}"
  launch: "${DONGCHEDI_PACKAGE}"

agent:
  groupName: 懂车帝首页进入我的页面
  groupDescription: 验证 Android 真机、模型配置和视觉点击链路可以正常工作。
  screenshotShrinkFactor: 2

tasks:
  - name: 从首页进入我的页面
    flow:
      - ai: 点击底部导航中的“我的”，进入“我的”页面。
      - aiAssert: 当前是懂车帝的“我的”页面，底部导航中的“我的”处于选中状态。
