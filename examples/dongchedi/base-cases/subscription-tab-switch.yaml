android:
  deviceId: "${ANDROID_DEVICE_ID}"
  launch: "${DONGCHEDI_PACKAGE}"

agent:
  groupName: 懂车帝关注订阅 Tab 切换
  groupDescription: 使用页面背景信息自动抵达目标页面，只在 Case 中描述待测功能。
  screenshotShrinkFactor: 2
  aiActContext: |
    首页
    - 上半部分金刚位有排行榜 icon，点击跳转到排行榜页面。
    - 中间有搜索框，点击进入搜索页面。
    - 下半部分有帖子瀑布流，可无限滚动。
    - 底部有 fixed tab，分别有首页、选车、AI、消息、我的 Tab，点击进入对应页面。

    排行榜页面
    - 上半部分可选择榜单。
    - 中部可选择 filter。
    - 下方是在榜车型 list，点击车型进入详情页。

    我的页面
    - 顶部有用户信息。
    - 中间有关注订阅、收藏按钮，点击进入对应页面。
    - 下方有所有功能列表。
    - 更下方不可见处有精彩活动列表。
    - 底部有 fixed tab，分别有首页、选车、AI、消息、我的 Tab，点击进入对应页面。

    关注订阅页面
    - 关注 Tab 下可查看关注的用户和汽车，点击可切换。

tasks:
  - name: 切换到订阅 Tab
    flow:
      - ai: 验证“关注订阅”页面可以切换到“订阅”Tab，完成后停留在“订阅”Tab。
      - aiAssert: 当前位于“关注订阅”页面，并且“订阅”Tab处于选中状态。

  - name: 从订阅切换到关注 Tab
    flow:
      - ai: 验证页面可以从“订阅”Tab切换到“关注”Tab，完成后停留在“关注”Tab。
      - aiAssert: 当前页面的“关注”Tab处于选中状态。

  - name: 从关注切换回订阅 Tab
    flow:
      - ai: 验证页面可以从“关注”Tab切换回“订阅”Tab，完成后停留在“订阅”Tab。
      - aiAssert: 当前页面的“订阅”Tab处于选中状态。
